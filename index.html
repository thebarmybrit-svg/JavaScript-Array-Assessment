<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Array Assignment</title>
        <meta http-equiv="X-UA-Compatable" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="ROBOTS" content="NOINDEX,NOFOLLOW">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div id="container">
            <div class="retainer">
                <h1>Image-Email Attatcher</h1>
                <h2>Random Image</h2>
                <div id="random-image-container"></div>
                <!-- <button class="newRandom">New Random Image</button> -->
            </div>
            <div class="retainer">
                <h2>Input Email</h2>
                <form id="emailForm" novalidate>
                    <label for="user-email">Email Address:</label>
                    <input 
                        type="email" 
                        id="user-email" 
                        name="email" 
                        placeholder="name@example.com" 
                        required
                    >
                    <button type="submit">Submit</button>
                </form>
            </div>
            <div class="retainer">
                <h2>Stored Image-Email Groups</h2>
                <div id="email-image-storage"></div>
            </div>
        </div>
        <!-- load image from https://picsum.photos
        tied to an email
        submition form (with email validation)
        When linked, a new image is to be loaded
        The interface is to display all images assigned to each email address, the email address should only display once.
        solution should run entirely in the browser without the need to be hosted on a web server. -->

        <script src="js/main.js"></script>
    </body>
</html>
